<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login SIKADU</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 107, 0, .35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(255, 51, 102, .30),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );
        }


        /* ==============================
           LOGIN CARD
        ============================== */

        .login-card {

            width: 100%;
            max-width: 420px;

            background: rgba(255,255,255,.97);

            border-radius: 24px;

            padding: 40px 35px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.35);

            animation: cardIn .5s ease;
        }


        @keyframes cardIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ==============================
           LOGO
        ============================== */

        .logo {

            width: 78px;
            height: 78px;

            margin: 0 auto 20px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 25px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #ff6b00,
                    #ff3366
                );

            box-shadow:
                0 12px 30px rgba(255,80,50,.35);
        }


        h1 {

            text-align: center;

            font-size: 29px;

            color: #111827;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            display: none;

            padding: 13px 15px;

            border-radius: 12px;

            margin-bottom: 20px;

            font-size: 13px;

            line-height: 1.5;
        }


        .message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;
        }


        .message.success {

            display: block;

            background: #dcfce7;

            color: #166534;
        }


        /* ==============================
           FORM
        ============================== */

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 700;

            color: #374151;
        }


        input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: .2s;
        }


        input:focus {

            border-color: #ff5a36;

            box-shadow:
                0 0 0 4px
                rgba(255,90,54,.10);
        }


        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 90px;
        }


        .toggle-password {

            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: #6b7280;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;
        }


        /* ==============================
           BUTTON
        ============================== */

        .login-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff6b00,
                    #ff3366
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;

            margin-top: 5px;
        }


        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(255,80,50,.30);
        }


        .login-button:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }


        /* ==============================
           LOADING
        ============================== */

        .loading {

            display: inline-block;

            width: 16px;
            height: 16px;

            border: 2px solid
                rgba(255,255,255,.4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: middle;

            margin-right: 8px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ==============================
           FOOTER
        ============================== */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 12px;
        }


        @media(max-width:480px) {

            .login-card {

                padding: 32px 24px;

                border-radius: 20px;
            }

            h1 {

                font-size: 25px;
            }

        }

    </style>
</head>


<body>


<div class="login-card">

    <div class="logo">
        SK
    </div>


    <h1>
        SIKADU
    </h1>


    <div class="subtitle">

        Sistem Informasi Akademik &
        Pembelajaran

        <br>

        <small>
            Silakan masuk menggunakan NIM
        </small>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <form id="loginForm">


        <!-- NIM -->

        <div class="form-group">

            <label for="nim">
                NIM
            </label>

            <input
                type="text"
                id="nim"
                placeholder="Masukkan NIM"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password">

                    Tampilkan

                </button>

            </div>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            id="loginButton"
            class="login-button">

            Masuk

        </button>


    </form>


    <div class="footer">

        © 2026 SIKADU

    </div>

</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCFtcNow9EGQlxhoX6jJKM97v40y1DdUjA",

    authDomain:
        "uin-sikadu.firebaseapp.com",

    databaseURL:
        "https://uin-sikadu-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "uin-sikadu",

    storageBucket:
        "uin-sikadu.firebasestorage.app",

    messagingSenderId:
        "58411098315",

    appId:
        "1:58411098315:web:f6092b636caa482872bb4e"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);



/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById("loginForm");

const nimInput =
    document.getElementById("nim");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");



/* =====================================================
   PASSWORD TOGGLE
===================================================== */

togglePassword.addEventListener(
    "click",
    () => {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "Sembunyikan";

        }

        else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "Tampilkan";

        }

    }
);



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "error"
) {

    message.textContent =
        text;

    message.className =
        `message ${type}`;

}



/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const nim =
            nimInput.value.trim();

        const password =
            passwordInput.value;


        if (!nim) {

            showMessage(
                "NIM wajib diisi."
            );

            return;

        }


        if (!password) {

            showMessage(
                "Password wajib diisi."
            );

            return;

        }


        /*
         * Firebase Authentication
         * menggunakan email/password.
         *
         * Kita buat email internal
         * berdasarkan NIM.
         */

        const email =
            `${nim}@sikadu.local`;


        loginButton.disabled =
            true;


        loginButton.innerHTML =
            `<span class="loading"></span>
             Memproses...`;


        try {


            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            console.log(
                "Login berhasil:",
                user.uid
            );


            /*
             * Simpan informasi sementara
             */

            sessionStorage.setItem(
                "sikadu_uid",
                user.uid
            );


            sessionStorage.setItem(
                "sikadu_nim",
                nim
            );


            showMessage(
                "Login berhasil. Mengarahkan ke dashboard...",
                "success"
            );


            /*
             * Redirect
             */

            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                800
            );


        }


        catch (error) {


            console.error(
                "Firebase Login Error:",
                error
            );


            let errorMessage =
                "NIM atau password salah.";


            switch(error.code) {


                case
                "auth/invalid-credential":

                    errorMessage =
                        "NIM atau password salah.";

                    break;


                case
                "auth/user-not-found":

                    errorMessage =
                        "Akun dengan NIM tersebut belum terdaftar.";

                    break;


                case
                "auth/wrong-password":

                    errorMessage =
                        "Password yang dimasukkan salah.";

                    break;


                case
                "auth/too-many-requests":

                    errorMessage =
                        "Terlalu banyak percobaan login. Silakan coba lagi nanti.";

                    break;


                case
                "auth/network-request-failed":

                    errorMessage =
                        "Tidak dapat terhubung ke Firebase. Periksa koneksi internet.";

                    break;


            }


            showMessage(
                errorMessage
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Masuk";

        }

    }
);

</script>

</body>
</html>
