<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="assets/style.css">
<style>
  .splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: white;
  }
  .splash .logo { width: 48px; height: 48px; }
  .splash p { color: rgba(255,255,255,.65); font-size: 14px; text-align: center; max-width: 320px; }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid rgba(255,255,255,.25);
    border-top-color: #1a9b62;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="brand-bg">

  <div class="splash">
    <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo UIN Gus Dur"></div>
    <div class="spinner"></div>
    <p id="statusText">Memeriksa sesi login...</p>
  </div>

  <script>
    // Watchdog TANPA type="module": kalau skrip module di bawah gagal jalan
    // sama sekali (paling sering karena file ini dibuka langsung dengan
    // dobel klik / file://, dan browser memblokir import ES module dari
    // file://), window.__sikaduModuleStarted tidak akan pernah ke-set,
    // sehingga pesan di bawah ini muncul menggantikan spinner yang diam.
    window.__sikaduModuleStarted = false;
    setTimeout(function () {
      if (!window.__sikaduModuleStarted) {
        document.getElementById("statusText").innerHTML =
          'Modul Firebase gagal dimuat/dijalankan.<br>' +
          'Buka Console browser (F12 → tab Console) untuk lihat pesan error aslinya.<br>' +
          'Penyebab tersering: (1) file dibuka langsung lewat file:// bukan http/https, ' +
          'atau (2) file di server tidak lengkap/tidak sinkron — pastikan SELURUH folder ' +
          '(termasuk /assets) di-upload ulang bersamaan, bukan satu file saja.';
        document.querySelector(".spinner").style.display = "none";
      }
    }, 4000);
  </script>

  <script type="module">
    import { auth, db, normalizeLevel, goToRoleHome } from "./assets/firebase-config.js?v=3";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    window.__sikaduModuleStarted = true;

    const statusText = document.getElementById("statusText");

    // Safety net kedua: kalau modul berhasil jalan tapi Firebase Auth belum
    // juga memberi status setelah 8 detik (mis. koneksi lambat/terblokir),
    // beri tahu pengguna dengan jelas alih-alih membiarkan spinner diam terus.
    let resolved = false;
    setTimeout(() => {
      if (!resolved) {
        statusText.innerHTML =
          'Memeriksa sesi login lebih lama dari biasanya.<br>' +
          'Periksa koneksi internet, atau domain ini belum ditambahkan di ' +
          'Firebase Console &rarr; Authentication &rarr; Settings &rarr; Authorized domains.';
      }
    }, 8000);

    onAuthStateChanged(auth, async (user) => {
      resolved = true;

      if (!user) {
        window.location.href = window.location.origin + "/login.html";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "users", user.uid));

        if (!snap.exists() || snap.data().isActive === false) {
          window.location.href = window.location.origin + "/login.html";
          return;
        }

        const profile = snap.data();
        const level = normalizeLevel(profile.level);

        sessionStorage.setItem("sikadu_uid", user.uid);
        sessionStorage.setItem("sikadu_username", profile.username || "");
        sessionStorage.setItem("sikadu_nama", profile.nama || "");
        sessionStorage.setItem("sikadu_level", level);

        if (!["admin", "dosen", "mahasiswa"].includes(level)) {
          statusText.textContent = "Akun ini belum memiliki peran (level) yang valid.";
          return;
        }

        goToRoleHome(level);
      } catch (err) {
        console.error(err);
        window.location.href = window.location.origin + "/login.html";
      }
    });
  </script>

</body>
</html>
