<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIKADU</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: white;
  }
  .splash .logo { width: 68px; height: 68px; font-size: 22px; border-radius: 20px; }
  .splash p { color: rgba(255,255,255,.65); font-size: 14px; }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid rgba(255,255,255,.25);
    border-top-color: #ff6b00;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="brand-bg">

  <div class="splash">
    <div class="logo">SK</div>
    <div class="spinner"></div>
    <p id="statusText">Memeriksa sesi login...</p>
  </div>

  <script type="module">
    import { auth, db, ROLE_HOME } from "./assets/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const statusText = document.getElementById("statusText");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "users", user.uid));

        if (!snap.exists() || snap.data().isActive === false) {
          window.location.href = "login.html";
          return;
        }

        const level = snap.data().level;
        const target = ROLE_HOME[level];

        if (!target) {
          statusText.textContent = "Akun ini belum memiliki peran (level) yang valid.";
          return;
        }

        window.location.href = target.replace(/^\//, "");
      } catch (err) {
        console.error(err);
        window.location.href = "login.html";
      }
    });
  </script>

</body>
</html>
