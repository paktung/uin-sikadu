<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SIKADU</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,.97);
    border-radius: var(--radius-lg);
    padding: 40px 35px;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
    animation: cardIn .5s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
  .login-card .logo { width: 78px; height: 78px; font-size: 25px; border-radius: 22px; margin: 0 auto 20px; }
  .login-card h1 { text-align: center; font-size: 29px; margin-bottom: 8px; }
  .login-card .subtitle { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .login-card .button-primary { width: 100%; font-size: 16px; margin-top: 4px; }
  .footer { text-align: center; margin-top: 25px; color: var(--muted-2); font-size: 12px; }
  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; border-radius: 20px; }
    .login-card h1 { font-size: 25px; }
  }
</style>
</head>
<body class="brand-bg">

<div class="login-wrap">
  <div class="login-card">

    <div class="logo">SK</div>
    <h1>SIKADU</h1>
    <div class="subtitle">
      Sistem Informasi Akademik &amp; Pembelajaran
      <br>
      <small>Masuk menggunakan NIM / NIDN / Username</small>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">NIM / NIDN / Username</label>
        <input
          type="text"
          id="username"
          placeholder="Masukkan NIM, NIDN, atau username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >
          <button type="button" id="togglePassword" class="toggle-password">Tampilkan</button>
        </div>
      </div>

      <button type="submit" id="loginButton" class="button-primary">Masuk</button>
    </form>

    <div class="footer">© 2026 SIKADU</div>

  </div>
</div>

<script type="module">
  import { auth, db, usernameToEmail, ROLE_HOME } from "./assets/firebase-config.js";
  import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("loginForm");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const loginButton = document.getElementById("loginButton");
  const message = document.getElementById("message");
  const togglePassword = document.getElementById("togglePassword");

  // Pesan dari redirect (mis. akun dinonaktifkan, sesi habis, dsb.)
  const params = new URLSearchParams(window.location.search);
  if (params.get("error") === "inactive") {
    showMessage("Akun Anda telah dinonaktifkan. Hubungi admin.");
  } else if (params.get("error") === "no-profile") {
    showMessage("Data akun tidak lengkap. Hubungi admin.");
  }

  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "Sembunyikan" : "Tampilkan";
  });

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = `message ${type}`;
  }

  function setLoading(isLoading) {
    loginButton.disabled = isLoading;
    loginButton.innerHTML = isLoading
      ? `<span class="loading"></span> Memproses...`
      : "Masuk";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username) { showMessage("NIM/NIDN/Username wajib diisi."); return; }
    if (!password) { showMessage("Password wajib diisi."); return; }

    const email = usernameToEmail(username);
    setLoading(true);

    try {
      const credential = await signInWithEmailAndPassword(auth, email, password);
      const user = credential.user;

      const profileRef = doc(db, "users", user.uid);
      const profileSnap = await getDoc(profileRef);

      if (!profileSnap.exists()) {
        await signOut(auth);
        showMessage("Data profil akun tidak ditemukan. Hubungi admin.");
        setLoading(false);
        return;
      }

      const profile = profileSnap.data();

      if (profile.isActive === false) {
        await signOut(auth);
        showMessage("Akun Anda telah dinonaktifkan. Hubungi admin.");
        setLoading(false);
        return;
      }

      const target = ROLE_HOME[profile.level];
      if (!target) {
        await signOut(auth);
        showMessage("Akun ini belum memiliki peran (level) yang valid. Hubungi admin.");
        setLoading(false);
        return;
      }

      // Catat waktu login terakhir, tapi jangan sampai gagalnya update ini
      // menghalangi user untuk tetap masuk.
      updateDoc(profileRef, { lastLoginAt: serverTimestamp() }).catch(() => {});

      showMessage("Login berhasil. Mengarahkan ke dashboard...", "success");
      setTimeout(() => { window.location.href = target.replace(/^\//, ""); }, 600);

    } catch (error) {
      console.error("Firebase Login Error:", error);

      const messages = {
        "auth/invalid-credential": "NIM/NIDN/Username atau password salah.",
        "auth/user-not-found": "Akun tersebut belum terdaftar.",
        "auth/wrong-password": "Password yang dimasukkan salah.",
        "auth/too-many-requests": "Terlalu banyak percobaan login. Silakan coba lagi nanti.",
        "auth/network-request-failed": "Tidak dapat terhubung ke server. Periksa koneksi internet.",
        "auth/user-disabled": "Akun ini telah dinonaktifkan. Hubungi admin.",
      };

      showMessage(messages[error.code] || "Terjadi kesalahan saat login. Silakan coba lagi.");
      setLoading(false);
    }
  });
</script>

</body>
</html>
