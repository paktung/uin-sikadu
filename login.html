<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SIKADU</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 390px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #111827;
    }

    .brand p {
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef0f4;
    }

    .login-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111827;
    }

    .login-subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      height: 46px;
      border: 1px solid #d9dee7;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    .input-wrapper input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #6b7280;
      font-size: 12px;
      padding: 5px;
    }

    .login-button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #4338ca;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 25px 20px;
      }

      .brand h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- TIDAK ADA LOGO DI SINI -->

    <div class="brand">
      <h1>SIKADU</h1>
      <p>Sistem Informasi Akademik &amp; Pembelajaran</p>
    </div>

    <div class="login-card">

      <div class="login-title">Selamat Datang</div>
      <div class="login-subtitle">
        Silakan masuk menggunakan akun Anda
      </div>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">Username</label>

          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-wrapper password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >
              Lihat
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Masuk
        </button>

      </form>
    </div>

    <div class="footer">
      &copy; 2026 SIKADU
    </div>

  </div>


  <script type="module">

    import {
      auth,
      db,
      usernameToEmail,
      ROLE_HOME
    } from "./assets/firebase-config.js";

    import {
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const togglePassword = document.getElementById("togglePassword");
    const message = document.getElementById("message");


    // =========================
    // SHOW / HIDE PASSWORD
    // =========================

    togglePassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "Sembunyikan";
      } else {
        passwordInput.type = "password";
        togglePassword.textContent = "Lihat";
      }

    });


    // =========================
    // MESSAGE
    // =========================

    function showMessage(text, type = "error") {

      message.textContent = text;
      message.className = `message ${type}`;

    }


    function hideMessage() {

      message.textContent = "";
      message.className = "message";

    }


    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      hideMessage();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showMessage("Username dan password wajib diisi.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Memproses...";


      try {

        // Username diubah menjadi email virtual
        const email = usernameToEmail(username);


        // LOGIN FIREBASE AUTH
        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;


        // =========================
        // AMBIL PROFIL FIRESTORE
        // =========================

        const profileRef = doc(
          db,
          "users",
          user.uid
        );

        const profileSnap = await getDoc(profileRef);


        if (!profileSnap.exists()) {

          await signOut(auth);

          showMessage(
            "Data profil akun tidak ditemukan di Firestore."
          );

          return;
        }


        const profile = profileSnap.data();


        // =========================
        // CEK STATUS AKUN
        // =========================

        if (profile.isActive === false) {

          await signOut(auth);

          showMessage(
            "Akun Anda sedang dinonaktifkan."
          );

          return;
        }


        // =========================
        // CEK LEVEL
        // =========================

        const level = String(
          profile.level || ""
        ).trim().toLowerCase();


        const target = ROLE_HOME[level];


        if (!target) {

          await signOut(auth);

          showMessage(
            "Level akun tidak valid."
          );

          return;
        }


        // =========================
        // SIMPAN SESSION
        // =========================

        sessionStorage.setItem(
          "sikadu_uid",
          user.uid
        );

        sessionStorage.setItem(
          "sikadu_username",
          profile.username || username
        );

        sessionStorage.setItem(
          "sikadu_nama",
          profile.nama || profile.username || username
        );

        sessionStorage.setItem(
          "sikadu_level",
          level
        );


        // Simpan waktu login
        updateDoc(
          profileRef,
          {
            lastLoginAt: serverTimestamp()
          }
        ).catch(() => {});


        // =========================
        // BERHASIL
        // =========================

        showMessage(
          `Login berhasil. Selamat datang, ${profile.nama || username}.`,
          "success"
        );


        setTimeout(() => {

          window.location.href =
            target.replace(/^\//, "");

        }, 700);


      } catch (error) {

        console.error("Login error:", error);

        let text =
          "Login gagal. Silakan periksa username dan password.";

        switch (error.code) {

          case "auth/invalid-credential":
            text =
              "Username atau password salah.";
            break;

          case "auth/user-not-found":
            text =
              "Akun tidak ditemukan.";
            break;

          case "auth/wrong-password":
            text =
              "Password salah.";
            break;

          case "auth/too-many-requests":
            text =
              "Terlalu banyak percobaan login. Silakan coba lagi nanti.";
            break;

          case "auth/network-request-failed":
            text =
              "Koneksi internet bermasalah.";
            break;

          case "auth/user-disabled":
            text =
              "Akun Firebase ini telah dinonaktifkan.";
            break;

          case "auth/unauthorized-domain":
            text =
              "Domain website belum diizinkan di Firebase Authentication.";
            break;

          case "permission-denied":
            text =
              "Akses Firestore ditolak. Periksa Firestore Security Rules.";
            break;
        }

        showMessage(text);

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Masuk";

      }

    });

  </script>

</body>
</html>
