<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - SIKADU</title>

  <link
    rel="icon"
    type="image/jpeg"
    href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg"
  >

  <link rel="stylesheet" href="assets/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    }

    /* LOGO KECIL */
    .login-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,.12);
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .login-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .subtitle small {
      font-size: 12px;
      color: #9ca3af;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 14px;
      outline: none;
      transition: .2s;
      background: #fff;
    }

    .form-group input:focus {
      border-color: #1a9b62;
      box-shadow: 0 0 0 3px rgba(26,155,98,.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 90px;
    }

    .toggle-password {
      position: absolute;
      right: 7px;
      top: 7px;
      height: 32px;
      border: 0;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 7px;
      padding: 0 9px;
      font-size: 11px;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: #e5e7eb;
    }

    .button-primary {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 10px;
      background: #1a9b62;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
      margin-top: 4px;
    }

    .button-primary:hover {
      background: #147b4d;
      transform: translateY(-1px);
    }

    .button-primary:disabled {
      opacity: .7;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -3px;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #9ca3af;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .login-wrap {
        padding: 16px;
      }

      .login-card {
        padding: 28px 22px;
        border-radius: 18px;
      }

      .login-logo {
        width: 54px;
        height: 54px;
      }

      .login-card h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body class="brand-bg">

  <div class="login-wrap">

    <div class="login-card">

      <!-- LOGO KECIL DI ATAS SIKADU -->
      <div class="login-logo">
        <img
          src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg"
          alt="Logo UIN Gus Dur"
        >
      </div>

      <h1>SIKADU</h1>

      <div class="subtitle">
        Sistem Informasi Akademik &amp; Pembelajaran
        <br>
        <small>Masuk menggunakan NIM / NIDN / Username</small>
      </div>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">
            NIM / NIDN / Username
          </label>

          <input
            type="text"
            id="username"
            placeholder="Masukkan NIM, NIDN, atau username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
            >
              Tampilkan
            </button>

          </div>

        </div>

        <button
          type="submit"
          id="loginButton"
          class="button-primary"
        >
          Masuk
        </button>

      </form>

      <div class="footer">
        © 2026 SIKADU
      </div>

    </div>

  </div>


  <script type="module">

    import {
      auth,
      db,
      usernameToEmail,
      ROLE_HOME
    } from "./assets/firebase-config.js";

    import {
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const form =
      document.getElementById("loginForm");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");


    /* =========================
       PESAN
    ========================= */

    function showMessage(text, type = "error") {

      message.textContent = text;
      message.className = `message ${type}`;

    }


    /* =========================
       LOADING
    ========================= */

    function setLoading(isLoading) {

      loginButton.disabled = isLoading;

      loginButton.innerHTML = isLoading
        ? `<span class="loading"></span> Memproses...`
        : "Masuk";

    }


    /* =========================
       SHOW / HIDE PASSWORD
    ========================= */

    togglePassword.addEventListener("click", () => {

      const hidden =
        passwordInput.type === "password";

      passwordInput.type =
        hidden ? "text" : "password";

      togglePassword.textContent =
        hidden ? "Sembunyikan" : "Tampilkan";

    });


    /* =========================
       LOGIN
    ========================= */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const username =
        usernameInput.value.trim();

      const password =
        passwordInput.value;


      if (!username) {

        showMessage(
          "NIM/NIDN/Username wajib diisi."
        );

        return;

      }


      if (!password) {

        showMessage(
          "Password wajib diisi."
        );

        return;

      }


      setLoading(true);


      try {

        /*
         * Contoh:
         *
         * paktung79
         * ↓
         * paktung79@sikadu.local
         */

        const email =
          usernameToEmail(username);


        /* LOGIN FIREBASE */

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          credential.user;


        /*
         * AMBIL PROFIL USER
         */

        const profileRef =
          doc(db, "users", user.uid);

        const profileSnap =
          await getDoc(profileRef);


        if (!profileSnap.exists()) {

          await signOut(auth);

          showMessage(
            "Data profil akun tidak ditemukan. Hubungi admin."
          );

          setLoading(false);

          return;

        }


        const profile =
          profileSnap.data();


        /*
         * CEK STATUS AKUN
         */

        if (profile.isActive === false) {

          await signOut(auth);

          showMessage(
            "Akun Anda telah dinonaktifkan. Hubungi admin."
          );

          setLoading(false);

          return;

        }


        /*
         * CEK LEVEL
         */

        const level =
          String(profile.level || "")
            .trim()
            .toLowerCase();


        const target =
          ROLE_HOME[level];


        if (!target) {

          await signOut(auth);

          showMessage(
            "Akun ini belum memiliki level yang valid."
          );

          setLoading(false);

          return;

        }


        /*
         * SIMPAN SESSION
         */

        sessionStorage.setItem(
          "sikadu_uid",
          user.uid
        );

        sessionStorage.setItem(
          "sikadu_username",
          profile.username || username
        );

        sessionStorage.setItem(
          "sikadu_nama",
          profile.nama || profile.username || username
        );

        sessionStorage.setItem(
          "sikadu_level",
          level
        );


        /*
         * UPDATE LOGIN TERAKHIR
         */

        updateDoc(
          profileRef,
          {
            lastLoginAt: serverTimestamp()
          }
        ).catch(error => {
          console.warn(
            "Gagal update lastLoginAt:",
            error
          );
        });


        /*
         * BERHASIL
         */

        showMessage(
          `Login berhasil. Selamat datang, ${profile.nama || username}.`,
          "success"
        );


        setTimeout(() => {

          window.location.href =
            target.replace(/^\//, "");

        }, 700);


      } catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        const messages = {

          "auth/invalid-credential":
            "Username atau password salah.",

          "auth/user-not-found":
            "Akun tersebut belum terdaftar.",

          "auth/wrong-password":
            "Password yang dimasukkan salah.",

          "auth/too-many-requests":
            "Terlalu banyak percobaan login. Silakan coba lagi nanti.",

          "auth/network-request-failed":
            "Tidak dapat terhubung ke server. Periksa koneksi internet.",

          "auth/user-disabled":
            "Akun ini telah dinonaktifkan.",

          "auth/unauthorized-domain":
            "Domain ini belum diizinkan di Firebase Authentication."

        };


        showMessage(
          messages[error.code] ||
          `Login gagal (${error.code || "unknown-error"}).`
        );


        setLoading(false);

      }

    });

  </script>

</body>
</html>
