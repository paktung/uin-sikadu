<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="assets/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,.97);
    border-radius: var(--radius-lg);
    padding: 40px 35px;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
    animation: cardIn .5s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
  .login-card .logo { width: 56px; height: 56px; margin: 0 auto 14px; }
  .login-card h1 { text-align: center; font-size: 27px; margin-bottom: 8px; }
  .login-card .subtitle { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .login-card .button-primary { width: 100%; font-size: 16px; margin-top: 4px; }
  .footer { text-align: center; margin-top: 25px; color: var(--muted-2); font-size: 12px; }
  .debug-box {
    display: none;
    margin-top: 16px;
    background: #0c1a14;
    color: #b7f5cf;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .debug-box.show { display: block; }
  .debug-box .k { color: #7fb8a3; }
  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; border-radius: 20px; }
    .login-card h1 { font-size: 24px; }
  }
</style>
</head>
<body class="brand-bg">

<div class="login-wrap">
  <div class="login-card">

    <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo UIN Gus Dur"></div>
    <h1>SIKADU</h1>
    <div class="subtitle">
      Sistem Informasi Akademik &amp; Pembelajaran
      <br>
      <small>Masuk menggunakan NIM / NIDN / Username</small>
    </div>

    <div id="message" class="message"></div>
    <pre id="debugBox" class="debug-box"></pre>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">NIM / NIDN / Username</label>
        <input
          type="text"
          id="username"
          placeholder="Masukkan NIM, NIDN, atau username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >
          <button type="button" id="togglePassword" class="toggle-password">Tampilkan</button>
        </div>
      </div>

      <button type="submit" id="loginButton" class="button-primary">Masuk</button>
    </form>

    <div class="footer">© 2026 SIKADU</div>

  </div>
</div>

<script type="module">
  import { auth, db, usernameToEmail, normalizeLevel, goToRoleHome } from "./assets/firebase-config.js?v=9";
  import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("loginForm");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const loginButton = document.getElementById("loginButton");
  const message = document.getElementById("message");
  const debugBox = document.getElementById("debugBox");
  const togglePassword = document.getElementById("togglePassword");

  // Pesan dari redirect (mis. akun dinonaktifkan, sesi habis, dsb.)
  const params = new URLSearchParams(window.location.search);
  if (params.get("error") === "inactive") {
    showMessage("Akun Anda telah dinonaktifkan. Hubungi admin.");
  } else if (params.get("error") === "no-profile") {
    showMessage("Data akun tidak lengkap. Hubungi admin.");
  }

  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "Sembunyikan" : "Tampilkan";
  });

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = `message ${type}`;
  }

  // Panel debug: menampilkan tahap yang gagal + detail teknis langsung di
  // halaman (tanpa perlu buka DevTools), sesuai yang diminta untuk
  // mempermudah diagnosa. Hanya tampil saat ada masalah.
  function showDebug(fields) {
    const lines = Object.entries(fields)
      .filter(([, v]) => v !== undefined && v !== null && v !== "")
      .map(([k, v]) => `${k}: ${v}`);
    debugBox.textContent = lines.join("\n");
    debugBox.classList.add("show");
  }

  function clearDebug() {
    debugBox.classList.remove("show");
    debugBox.textContent = "";
  }

  function setLoading(isLoading) {
    loginButton.disabled = isLoading;
    loginButton.innerHTML = isLoading
      ? `<span class="loading"></span> Memproses...`
      : "Masuk";
  }

  const AUTH_ERROR_MESSAGES = {
    "auth/invalid-credential": "NIM/NIDN/Username atau password salah.",
    "auth/user-not-found": "Akun tersebut belum terdaftar di Firebase Authentication.",
    "auth/wrong-password": "Password yang dimasukkan salah.",
    "auth/too-many-requests": "Terlalu banyak percobaan login. Silakan coba lagi nanti.",
    "auth/network-request-failed": "Tidak dapat terhubung ke server. Periksa koneksi internet.",
    "auth/user-disabled": "Akun ini telah dinonaktifkan di Firebase Authentication.",
    "auth/unauthorized-domain": "Domain ini belum diizinkan di Firebase Console (Authentication → Settings → Authorized domains).",
    "auth/invalid-email": "Format username menghasilkan email virtual yang tidak valid.",
  };

  const FIRESTORE_ERROR_MESSAGES = {
    "permission-denied": "Autentikasi berhasil, tetapi Firestore menolak membaca profil (permission-denied). Ini soal Firestore Security Rules, bukan password.",
    "unavailable": "Autentikasi berhasil, tetapi Firestore sedang tidak bisa dihubungi. Periksa koneksi internet.",
  };

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearDebug();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username) { showMessage("NIM/NIDN/Username wajib diisi."); return; }
    if (!password) { showMessage("Password wajib diisi."); return; }

    const email = usernameToEmail(username);
    setLoading(true);

    console.log("=== SIKADU LOGIN DEBUG ===");
    console.log("Username:", username);
    console.log("Email virtual:", email);

    // ---------- TAHAP 1: Firebase Authentication ----------
    let user;
    try {
      const credential = await signInWithEmailAndPassword(auth, email, password);
      user = credential.user;
      console.log("Firebase UID:", user.uid);
      console.log("Firebase email:", user.email);
    } catch (error) {
      console.error("Firebase Auth Error:", error);
      showMessage(AUTH_ERROR_MESSAGES[error.code] || `Autentikasi gagal (${error.code || error.message}).`);
      showDebug({
        "TAHAP": "Firebase Authentication",
        "ERROR CODE": error.code || "-",
        "ERROR MESSAGE": error.message || "-",
      });
      setLoading(false);
      return;
    }

    // ---------- TAHAP 2: Ambil profil Firestore users/{uid} ----------
    const profileRef = doc(db, "users", user.uid);
    let profileSnap;
    try {
      profileSnap = await getDoc(profileRef);
      console.log("Profile exists:", profileSnap.exists());
      if (profileSnap.exists()) console.log("Profile:", profileSnap.data());
    } catch (error) {
      console.error("Firestore Error:", error);
      await signOut(auth);
      showMessage(FIRESTORE_ERROR_MESSAGES[error.code] || `Gagal membaca profil Firestore (${error.code || error.message}).`);
      showDebug({
        "TAHAP": "Membaca Firestore users/{uid}",
        "UID": user.uid,
        "ERROR CODE": error.code || "-",
        "ERROR MESSAGE": error.message || "-",
      });
      setLoading(false);
      return;
    }

    // ---------- TAHAP 3: Validasi profil ----------
    if (!profileSnap.exists()) {
      await signOut(auth);
      showMessage("Autentikasi berhasil, tetapi profil Firestore tidak ditemukan (users/" + user.uid + ").");
      showDebug({
        "TAHAP": "Validasi profil",
        "UID": user.uid,
        "STATUS FIRESTORE": "Dokumen users/" + user.uid + " tidak ada",
        "CATATAN": "Pastikan Document ID di Firestore SAMA PERSIS dengan UID Firebase Authentication ini.",
      });
      setLoading(false);
      return;
    }

    const profile = profileSnap.data();
    const level = normalizeLevel(profile.level);

    if (profile.isActive === false) {
      await signOut(auth);
      showMessage("Akun Anda telah dinonaktifkan. Hubungi admin.");
      showDebug({ "TAHAP": "Validasi profil", "UID": user.uid, "STATUS PROFILE": "isActive = false" });
      setLoading(false);
      return;
    }

    if (!["admin", "dosen", "mahasiswa"].includes(level)) {
      await signOut(auth);
      showMessage("Akun ini belum memiliki peran (level) yang valid. Hubungi admin.");
      showDebug({
        "TAHAP": "Menentukan role",
        "UID": user.uid,
        "STATUS PROFILE": "ditemukan",
        "level (mentah)": JSON.stringify(profile.level),
        "level (dinormalisasi)": level || "(kosong)",
        "CATATAN": "level harus persis salah satu dari: admin, dosen, mahasiswa.",
      });
      setLoading(false);
      return;
    }

    // ---------- TAHAP 4: Sukses - simpan sesi (untuk UI saja, bukan sumber otorisasi) ----------
    sessionStorage.setItem("sikadu_uid", user.uid);
    sessionStorage.setItem("sikadu_username", profile.username || username);
    sessionStorage.setItem("sikadu_nama", profile.nama || "");
    sessionStorage.setItem("sikadu_level", level);

    updateDoc(profileRef, { lastLoginAt: serverTimestamp() }).catch((e) => console.warn("Gagal update lastLoginAt:", e));

    showMessage("Login berhasil. Mengarahkan ke dashboard...", "success");
    setTimeout(() => goToRoleHome(level), 500);
  });
</script>

</body>
</html>
