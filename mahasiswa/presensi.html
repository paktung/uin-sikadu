<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="../assets/style.css?v=9">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo"></div>
      <div><div class="name">SIKADU</div><div class="role">Panel Mahasiswa</div></div>
    </div>
    <div class="sidebar-avatar-block">
      <div class="avatar" id="sidebarAvatar">M</div>
      <div class="name" id="sidebarUser">Memuat...</div>
      <div class="role">Mahasiswa</div>
      <div class="underline"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button id="logoutButton" class="button-secondary sidebar-logout">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Presensi</h1><p>Rekap kehadiran Anda per kelas.</p></div>
    </div>

    <div id="pageMessage" class="message"></div>

    <div class="card" style="margin-bottom:20px;">
      <div class="form-group" style="margin-bottom:0;">
        <label for="kelasSelect">Pilih Kelas</label>
        <select id="kelasSelect"></select>
      </div>
    </div>

    <div class="stat-grid-elegant" id="statGrid" style="display:none;">
      <div class="stat-card-elegant"><div class="stat-icon c1">✅</div><div class="stat-text"><div class="label">Hadir</div><div class="value" id="cHadir">0</div></div></div>
      <div class="stat-card-elegant"><div class="stat-icon c3">📩</div><div class="stat-text"><div class="label">Izin</div><div class="value" id="cIzin">0</div></div></div>
      <div class="stat-card-elegant"><div class="stat-icon c2">🤒</div><div class="stat-text"><div class="label">Sakit</div><div class="value" id="cSakit">0</div></div></div>
      <div class="stat-card-elegant"><div class="stat-icon c6">❌</div><div class="stat-text"><div class="label">Alpa</div><div class="value" id="cAlpa">0</div></div></div>
    </div>

    <div class="card">
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>Pertemuan</th><th>Tanggal</th><th>Topik</th><th>Status</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">Belum ada data presensi untuk kelas ini.</div>
    </div>
  </main>
</div>

<script type="module">
  import { guardPage, logout } from "../assets/auth-guard.js?v=9";
  import { renderMahasiswaNav } from "../assets/mahasiswa-nav.js?v=9";
  import { db } from "../assets/firebase-config.js?v=9";
  import { withTimeout } from "../assets/with-timeout.js?v=9";
  import {
    collection, doc, getDoc, getDocs, query, where,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  function initials(name) {
    if (!name) return "M";
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "M";
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const BADGE = { Hadir: "active", Izin: "inactive", Sakit: "inactive", Alpa: "inactive" };

  renderMahasiswaNav("presensi.html");
  const { uid, profile } = await guardPage("mahasiswa");
  document.getElementById("sidebarUser").textContent = profile.nama || profile.username || "Mahasiswa";
  document.getElementById("sidebarAvatar").textContent = initials(profile.nama || profile.username);
  document.getElementById("logoutButton").addEventListener("click", logout);

  const pageMessage = document.getElementById("pageMessage");
  function showPageMessage(text, type = "error") {
    pageMessage.textContent = text;
    pageMessage.className = `message ${type}`;
    if (text) setTimeout(() => { pageMessage.className = "message"; }, 4000);
  }

  const kelasSelect = document.getElementById("kelasSelect");

  async function loadKelasSaya() {
    const tahunSnap = await withTimeout(getDocs(query(collection(db, "tahunAkademik"), where("isActive", "==", true))), 15000, "Memuat tahun akademik");
    if (tahunSnap.empty) { kelasSelect.innerHTML = `<option value="">Belum ada tahun akademik aktif</option>`; return; }
    const tahunId = tahunSnap.docs[0].id;

    const krsSnap = await withTimeout(getDocs(query(collection(db, "krs"), where("mahasiswaId", "==", uid), where("tahunAkademikId", "==", tahunId))), 15000, "Memuat KRS");
    if (krsSnap.empty) {
      kelasSelect.innerHTML = `<option value="">Anda belum mengambil kelas apapun</option>`;
      document.getElementById("emptyState").style.display = "block";
      document.getElementById("emptyState").textContent = "Isi KRS terlebih dahulu untuk melihat presensi.";
      return;
    }

    const kelasIds = krsSnap.docs.map((d) => d.data().kelasKuliahId);
    const kelasDocs = await Promise.all(kelasIds.map((id) => getDoc(doc(db, "kelasKuliah", id))));
    const validKelas = kelasDocs.filter((d) => d.exists());
    const mkIds = [...new Set(validKelas.map((d) => d.data().mataKuliahId))];
    const mkDocs = await Promise.all(mkIds.map((id) => getDoc(doc(db, "mataKuliah", id))));
    const mkById = {};
    mkDocs.forEach((d) => { if (d.exists()) mkById[d.id] = d.data(); });

    kelasSelect.innerHTML = validKelas.map((d) => {
      const k = d.data();
      const mk = mkById[k.mataKuliahId] || {};
      return `<option value="${d.id}">${escapeHtml(mk.nama || "-")} - Kelas ${escapeHtml(k.kodeKelas || "-")}</option>`;
    }).join("");

    await loadPresensi();
  }

  async function loadPresensi() {
    const kelasId = kelasSelect.value;
    const tableBody = document.getElementById("tableBody");
    const emptyState = document.getElementById("emptyState");
    const statGrid = document.getElementById("statGrid");
    if (!kelasId) { tableBody.innerHTML = ""; statGrid.style.display = "none"; return; }

    tableBody.innerHTML = `<tr><td colspan="4" class="empty-state">Memuat...</td></tr>`;

    const pertemuanSnap = await withTimeout(getDocs(query(collection(db, "pertemuan"), where("kelasKuliahId", "==", kelasId))), 15000, "Memuat pertemuan");
    const pertemuanRows = pertemuanSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
    pertemuanRows.sort((a, b) => (a.pertemuanKe || 0) - (b.pertemuanKe || 0));

    if (pertemuanRows.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      emptyState.textContent = "Belum ada pertemuan tercatat untuk kelas ini.";
      statGrid.style.display = "none";
      return;
    }

    const absensiDocs = await Promise.all(pertemuanRows.map((p) => getDoc(doc(db, "absensi", `${p.id}_${uid}`))));
    const statusByPertemuan = {};
    absensiDocs.forEach((d, i) => { if (d.exists()) statusByPertemuan[pertemuanRows[i].id] = d.data().status; });

    const counts = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 };
    tableBody.innerHTML = "";
    pertemuanRows.forEach((p) => {
      const status = statusByPertemuan[p.id];
      if (status && counts[status] !== undefined) counts[status]++;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(p.pertemuanKe)}</td>
        <td>${escapeHtml(p.tanggal || "-")}</td>
        <td>${escapeHtml(p.judul || "-")}</td>
        <td>${status ? `<span class="badge ${BADGE[status]}">${status}</span>` : '<span class="badge inactive">Belum diabsen</span>'}</td>
      `;
      tableBody.appendChild(tr);
    });

    document.getElementById("cHadir").textContent = counts.Hadir;
    document.getElementById("cIzin").textContent = counts.Izin;
    document.getElementById("cSakit").textContent = counts.Sakit;
    document.getElementById("cAlpa").textContent = counts.Alpa;
    statGrid.style.display = "grid";
    emptyState.style.display = "none";
  }

  kelasSelect.addEventListener("change", () => loadPresensi().catch((err) => showPageMessage(err.message || "Gagal memuat presensi.")));

  loadKelasSaya().catch((err) => { console.error(err); showPageMessage(err.message || "Gagal memuat kelas."); });
</script>

</body>
</html>
