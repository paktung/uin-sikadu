<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas Saya - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="../assets/style.css?v=9">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo"></div>
      <div><div class="name">SIKADU</div><div class="role">Panel Mahasiswa</div></div>
    </div>
    <div class="sidebar-avatar-block">
      <div class="avatar" id="sidebarAvatar">M</div>
      <div class="name" id="sidebarUser">Memuat...</div>
      <div class="role">Mahasiswa</div>
      <div class="underline"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button id="logoutButton" class="button-secondary sidebar-logout">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Kelas Saya</h1><p>Kelas yang sudah didaftarkan dosen untuk Anda pada periode aktif.</p></div>
    </div>

    <div id="pageMessage" class="message"></div>

    <div class="info-card-highlight">
      <div class="stat-icon c1">📅</div>
      <div>
        <div class="title">Tahun Akademik Aktif</div>
        <div class="value" id="tahunAktifLabel">Memuat...</div>
      </div>
    </div>

    <div class="card">
      <div id="krsList"></div>
      <div id="krsEmpty" class="empty-state" style="display:none;">
        Anda belum terdaftar di kelas manapun untuk periode ini. Hubungi dosen/admin
        jika seharusnya sudah terdaftar.
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { guardPage, logout } from "../assets/auth-guard.js?v=9";
  import { renderMahasiswaNav } from "../assets/mahasiswa-nav.js?v=9";
  import { db } from "../assets/firebase-config.js?v=9";
  import { withTimeout } from "../assets/with-timeout.js?v=9";
  import {
    collection, doc, getDoc, getDocs, query, where,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  function initials(name) {
    if (!name) return "M";
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "M";
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function jadwalText(k) {
    if (!k.hari) return "";
    return `${k.hari}, ${k.jamMulai || "?"}-${k.jamSelesai || "?"} @ ${k.ruang || "-"}`;
  }

  renderMahasiswaNav("krs.html");
  const { uid, profile } = await guardPage("mahasiswa");
  document.getElementById("sidebarUser").textContent = profile.nama || profile.username || "Mahasiswa";
  document.getElementById("sidebarAvatar").textContent = initials(profile.nama || profile.username);
  document.getElementById("logoutButton").addEventListener("click", logout);

  const pageMessage = document.getElementById("pageMessage");
  function showPageMessage(text, type = "error") {
    pageMessage.textContent = text;
    pageMessage.className = `message ${type}`;
    if (text) setTimeout(() => { pageMessage.className = "message"; }, 4000);
  }

  async function loadKelasSaya() {
    const tahunSnap = await withTimeout(getDocs(query(collection(db, "tahunAkademik"), where("isActive", "==", true))), 15000, "Memuat tahun akademik");
    if (tahunSnap.empty) {
      document.getElementById("tahunAktifLabel").textContent = "Belum ada periode aktif";
      return;
    }
    const tahun = tahunSnap.docs[0].data();
    document.getElementById("tahunAktifLabel").textContent = `${tahun.tahun} - Semester ${tahun.semester}`;
    const tahunId = tahunSnap.docs[0].id;

    const krsSnap = await withTimeout(getDocs(query(collection(db, "krs"), where("mahasiswaId", "==", uid), where("tahunAkademikId", "==", tahunId))), 15000, "Memuat kelas saya");

    const krsList = document.getElementById("krsList");
    const krsEmpty = document.getElementById("krsEmpty");

    if (krsSnap.empty) {
      krsList.innerHTML = "";
      krsEmpty.style.display = "block";
      return;
    }
    krsEmpty.style.display = "none";

    const kelasDocs = await Promise.all(krsSnap.docs.map((d) => getDoc(doc(db, "kelasKuliah", d.data().kelasKuliahId))));
    const validKelas = kelasDocs.filter((d) => d.exists());
    const mkIds = [...new Set(validKelas.map((d) => d.data().mataKuliahId))];
    const dosenIds = [...new Set(validKelas.map((d) => d.data().dosenId))];
    const [mkDocs, dosenDocs] = await Promise.all([
      Promise.all(mkIds.map((id) => getDoc(doc(db, "mataKuliah", id)))),
      Promise.all(dosenIds.map((id) => getDoc(doc(db, "dosen", id)))),
    ]);
    const mkById = {}; mkDocs.forEach((d) => { if (d.exists()) mkById[d.id] = d.data(); });
    const dosenById = {}; dosenDocs.forEach((d) => { if (d.exists()) dosenById[d.id] = d.data(); });

    krsList.innerHTML = "";
    validKelas.forEach((d) => {
      const k = d.data();
      const mk = mkById[k.mataKuliahId] || {};
      const dosen = dosenById[k.dosenId] || {};
      const card = document.createElement("div");
      card.className = "class-card";
      const jadwal = jadwalText(k);
      card.innerHTML = `
        <div class="title">${escapeHtml(mk.nama || "-")} - Kelas ${escapeHtml(k.kodeKelas || "-")} (${escapeHtml(mk.sks ?? "-")} SKS)</div>
        <div class="meta">
          <span>Dosen: ${escapeHtml(dosen.nama || "-")}</span>
          ${jadwal ? `<span>${escapeHtml(jadwal)}</span>` : ""}
        </div>
      `;
      krsList.appendChild(card);
    });
  }

  loadKelasSaya().catch((err) => { console.error(err); showPageMessage(err.message || "Gagal memuat kelas."); });
</script>

</body>
</html>
