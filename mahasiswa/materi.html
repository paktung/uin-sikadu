<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="../assets/style.css?v=11">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo"></div>
      <div><div class="name">SIKADU</div><div class="role">Panel Mahasiswa</div></div>
    </div>
    <div class="sidebar-avatar-block">
      <div class="avatar" id="sidebarAvatar">M</div>
      <div class="name" id="sidebarUser">Memuat...</div>
      <div class="role">Mahasiswa</div>
      <div class="underline"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button id="logoutButton" class="button-secondary sidebar-logout">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Materi</h1><p>Pilih pertemuan untuk melihat materinya.</p></div>
    </div>

    <div id="pageMessage" class="message"></div>

    <div class="card" style="margin-bottom:20px;">
      <div class="form-group" style="margin-bottom:0;">
        <label for="kelasSelect">Pilih Kelas</label>
        <select id="kelasSelect"></select>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h2 style="font-size:15px; margin-bottom:12px;">Pertemuan</h2>
      <div id="pertemuanList" class="scroll-panel" style="max-height:40vh;"></div>
      <div id="pertemuanEmpty" class="empty-state" style="display:none;">Belum ada pertemuan untuk kelas ini.</div>
    </div>

    <div class="card" id="materiCard" style="display:none;">
      <h2 style="font-size:15px; margin-bottom:12px;" id="materiCardTitle">Materi</h2>
      <div id="materiList" class="scroll-panel" style="max-height:50vh;"></div>
      <div id="materiEmpty" class="empty-state" style="display:none;">Belum ada materi untuk pertemuan ini.</div>
    </div>
  </main>
</div>

<script type="module">
  import { guardPage, logout } from "../assets/auth-guard.js?v=11";
  import { renderMahasiswaNav } from "../assets/mahasiswa-nav.js?v=11";
  import { db } from "../assets/firebase-config.js?v=11";
  import { withTimeout } from "../assets/with-timeout.js?v=11";
  import {
    collection, doc, getDoc, getDocs, query, where,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  function initials(name) {
    if (!name) return "M";
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "M";
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function linkify(url, label) {
    return url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="color:var(--accent-2); font-weight:600;">${label}</a>` : "";
  }

  renderMahasiswaNav("materi.html");
  const { uid, profile } = await guardPage("mahasiswa");
  document.getElementById("sidebarUser").textContent = profile.nama || profile.username || "Mahasiswa";
  document.getElementById("sidebarAvatar").textContent = initials(profile.nama || profile.username);
  document.getElementById("logoutButton").addEventListener("click", logout);

  const pageMessage = document.getElementById("pageMessage");
  function showPageMessage(text, type = "error") {
    pageMessage.textContent = text;
    pageMessage.className = `message ${type}`;
    if (text) setTimeout(() => { pageMessage.className = "message"; }, 4000);
  }

  const kelasSelect = document.getElementById("kelasSelect");
  let pertemuanRows = [];
  let activePertemuanId = null;

  async function loadKelasSaya() {
    const tahunSnap = await withTimeout(getDocs(query(collection(db, "tahunAkademik"), where("isActive", "==", true))), 15000, "Memuat tahun akademik");
    if (tahunSnap.empty) { kelasSelect.innerHTML = `<option value="">Belum ada tahun akademik aktif</option>`; return; }
    const tahunId = tahunSnap.docs[0].id;

    const krsSnap = await withTimeout(getDocs(query(collection(db, "krs"), where("mahasiswaId", "==", uid), where("tahunAkademikId", "==", tahunId))), 15000, "Memuat KRS");
    if (krsSnap.empty) {
      kelasSelect.innerHTML = `<option value="">Anda belum terdaftar di kelas manapun</option>`;
      document.getElementById("pertemuanEmpty").style.display = "block";
      document.getElementById("pertemuanEmpty").textContent = "Anda belum terdaftar di kelas manapun. Hubungi dosen.";
      return;
    }

    const kelasIds = krsSnap.docs.map((d) => d.data().kelasKuliahId);
    const kelasDocs = await Promise.all(kelasIds.map((id) => getDoc(doc(db, "kelasKuliah", id))));
    const validKelas = kelasDocs.filter((d) => d.exists());
    const mkIds = [...new Set(validKelas.map((d) => d.data().mataKuliahId))];
    const mkDocs = await Promise.all(mkIds.map((id) => getDoc(doc(db, "mataKuliah", id))));
    const mkById = {};
    mkDocs.forEach((d) => { if (d.exists()) mkById[d.id] = d.data(); });

    kelasSelect.innerHTML = validKelas.map((d) => {
      const k = d.data();
      const mk = mkById[k.mataKuliahId] || {};
      return `<option value="${d.id}">${escapeHtml(mk.nama || "-")} - Kelas ${escapeHtml(k.kodeKelas || "-")}</option>`;
    }).join("");

    await loadPertemuan();
  }

  async function loadPertemuan() {
    const kelasId = kelasSelect.value;
    const pertemuanList = document.getElementById("pertemuanList");
    const pertemuanEmpty = document.getElementById("pertemuanEmpty");
    document.getElementById("materiCard").style.display = "none";
    activePertemuanId = null;
    if (!kelasId) { pertemuanList.innerHTML = ""; return; }

    pertemuanList.innerHTML = `<p class="hint">Memuat...</p>`;
    const snap = await withTimeout(getDocs(query(collection(db, "pertemuan"), where("kelasKuliahId", "==", kelasId))), 15000, "Memuat pertemuan");
    pertemuanRows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    pertemuanRows.sort((a, b) => (a.pertemuanKe || 0) - (b.pertemuanKe || 0));

    pertemuanList.innerHTML = "";
    pertemuanEmpty.style.display = pertemuanRows.length === 0 ? "block" : "none";
    pertemuanEmpty.textContent = "Belum ada pertemuan untuk kelas ini.";

    pertemuanRows.forEach((p) => {
      const card = document.createElement("div");
      card.className = "class-card";
      card.style.cursor = "pointer";
      card.dataset.pertemuanId = p.id;
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
          <div>
            <div class="title">Pertemuan ${escapeHtml(p.pertemuanKe)}${p.judul ? " - " + escapeHtml(p.judul) : ""}</div>
            <div class="meta"><span>${escapeHtml(p.tanggal || "-")}</span></div>
          </div>
          <span class="button-secondary" style="pointer-events:none;">Lihat Materi &rarr;</span>
        </div>`;
      pertemuanList.appendChild(card);
    });
  }

  kelasSelect.addEventListener("change", () => loadPertemuan().catch((err) => showPageMessage(err.message || "Gagal memuat pertemuan.")));

  document.getElementById("pertemuanList").addEventListener("click", async (e) => {
    const card = e.target.closest("[data-pertemuan-id]");
    if (!card) return;
    activePertemuanId = card.dataset.pertemuanId;
    const p = pertemuanRows.find((r) => r.id === activePertemuanId);
    document.getElementById("materiCardTitle").textContent = `Materi - Pertemuan ${p?.pertemuanKe ?? ""}${p?.judul ? " - " + p.judul : ""}`;
    document.getElementById("materiCard").style.display = "block";
    document.getElementById("materiCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
    loadMateri().catch((err) => showPageMessage(err.message || "Gagal memuat materi."));
  });

  async function loadMateri() {
    const materiList = document.getElementById("materiList");
    const materiEmpty = document.getElementById("materiEmpty");
    if (!activePertemuanId) return;

    materiList.innerHTML = `<p class="hint">Memuat...</p>`;
    const snap = await withTimeout(
      getDocs(query(collection(db, "materi"), where("pertemuanId", "==", activePertemuanId), where("published", "==", true))),
      15000, "Memuat materi"
    );
    const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    rows.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

    materiList.innerHTML = "";
    materiEmpty.style.display = rows.length === 0 ? "block" : "none";
    materiEmpty.textContent = "Belum ada materi untuk pertemuan ini.";

    rows.forEach((m) => {
      const card = document.createElement("div");
      card.className = "class-card";
      card.innerHTML = `
        <div class="title">${escapeHtml(m.judul)}</div>
        <div class="meta" style="margin-bottom:8px;">${escapeHtml(m.deskripsi || "")}</div>
        ${m.isiMateri ? `<div class="materi-content" style="font-size:14px; line-height:1.7; margin-bottom:8px;">${m.isiMateri}</div>` : ""}
        <div style="display:flex; gap:16px;">
          ${linkify(m.fileUrl, "📄 Buka File")}
          ${linkify(m.videoUrl, "🎬 Tonton Video")}
        </div>`;
      materiList.appendChild(card);
    });
  }

  loadKelasSaya().catch((err) => { console.error(err); showPageMessage(err.message || "Gagal memuat kelas."); });
</script>

</body>
</html>
