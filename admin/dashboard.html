<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo UIN Gus Dur"></div>
      <div>
        <div class="name">SIKADU</div>
        <div class="role">Panel Admin</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="dosen.html">Data Dosen</a>
      <a href="mahasiswa.html">Data Mahasiswa</a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser">Memuat...</div>
      <button id="logoutButton" class="button-secondary" style="width:100%">Keluar</button>
    </div>
  </aside>

  <main class="main">

    <div class="page-header">
      <div>
        <h1 id="greeting">Dashboard</h1>
        <p>Ringkasan data akademik SIKADU.</p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Total Dosen</div>
        <div class="value" id="statDosen">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Mahasiswa</div>
        <div class="value" id="statMahasiswa">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Dosen Nonaktif</div>
        <div class="value" id="statDosenInactive">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Mahasiswa Nonaktif</div>
        <div class="value" id="statMahasiswaInactive">-</div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:16px; margin-bottom:14px;">Langkah cepat</h2>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <a href="dosen.html" class="button-secondary" style="text-decoration:none;">+ Tambah Dosen</a>
        <a href="mahasiswa.html" class="button-secondary" style="text-decoration:none;">+ Tambah Mahasiswa</a>
      </div>
    </div>

  </main>
</div>

<script type="module">
  import { guardPage, logout } from "../assets/auth-guard.js";
  import { db } from "../assets/firebase-config.js";
  import {
    collection, query, where, getCountFromServer,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const { profile } = await guardPage("admin");

  document.getElementById("sidebarUser").textContent = profile.nama || profile.username || "Admin";
  document.getElementById("greeting").textContent = `Halo, ${profile.nama || profile.username}`;
  document.getElementById("logoutButton").addEventListener("click", logout);

  async function loadStats() {
    const dosenCol = collection(db, "dosen");
    const mahasiswaCol = collection(db, "mahasiswa");
    const usersCol = collection(db, "users");

    const [dosenCount, mahasiswaCount, dosenInactive, mahasiswaInactive] = await Promise.all([
      getCountFromServer(dosenCol),
      getCountFromServer(mahasiswaCol),
      getCountFromServer(query(usersCol, where("level", "==", "dosen"), where("isActive", "==", false))),
      getCountFromServer(query(usersCol, where("level", "==", "mahasiswa"), where("isActive", "==", false))),
    ]);

    document.getElementById("statDosen").textContent = dosenCount.data().count;
    document.getElementById("statMahasiswa").textContent = mahasiswaCount.data().count;
    document.getElementById("statDosenInactive").textContent = dosenInactive.data().count;
    document.getElementById("statMahasiswaInactive").textContent = mahasiswaInactive.data().count;
  }

  loadStats().catch((err) => console.error("Gagal memuat statistik:", err));
</script>

</body>
</html>
