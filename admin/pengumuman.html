<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="../assets/style.css?v=8">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo"></div>
      <div><div class="name">SIKADU</div><div class="role">Panel Admin</div></div>
    </div>
    <div class="sidebar-avatar-block">
      <div class="avatar" id="sidebarAvatar">A</div>
      <div class="name" id="sidebarUser">Memuat...</div>
      <div class="role">Administrator</div>
      <div class="underline"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button id="logoutButton" class="button-secondary sidebar-logout">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Pengumuman</h1><p>Pengumuman umum yang tampil untuk seluruh dosen &amp; mahasiswa.</p></div>
      <button id="addButton" class="button-primary">+ Buat Pengumuman</button>
    </div>

    <div id="pageMessage" class="message"></div>

    <div class="card">
      <div class="table-toolbar">
        <input type="search" id="searchInput" placeholder="Cari judul...">
        <span class="hint" id="rowCount"></span>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>Judul</th><th>Status</th><th>Dibuat</th><th></th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">Belum ada pengumuman.</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle">Buat Pengumuman</h2><button class="modal-close" id="modalClose">&times;</button></div>
    <div id="modalMessage" class="message"></div>
    <form id="itemForm">
      <input type="hidden" id="itemId">
      <div class="form-group"><label for="judul">Judul</label><input type="text" id="judul" required></div>
      <div class="form-group"><label for="isi">Isi Pengumuman</label><textarea id="isi" rows="5" required></textarea></div>
      <div class="form-group" style="display:flex; align-items:center; gap:10px;">
        <input type="checkbox" id="published" style="width:auto;" checked>
        <label for="published" style="margin:0;">Tampilkan sekarang (published)</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="button-secondary" id="cancelButton">Batal</button>
        <button type="submit" class="button-primary" id="saveButton">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { guardPage, logout } from "../assets/auth-guard.js?v=8";
  import { renderAdminNav } from "../assets/admin-nav.js?v=8";
  import { db } from "../assets/firebase-config.js?v=8";
  import { withTimeout } from "../assets/with-timeout.js?v=8";
  import {
    collection, doc, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
  function initials(name) {
    if (!name) return "A";
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "A";
  }


  renderAdminNav("pengumuman.html");
  const { profile } = await guardPage("admin");
  document.getElementById("sidebarUser").textContent = profile.nama || profile.username || "Admin";
  document.getElementById("sidebarAvatar").textContent = initials(profile.nama || profile.username);
  document.getElementById("logoutButton").addEventListener("click", logout);

  let allRows = [];
  const tableBody = document.getElementById("tableBody");
  const emptyState = document.getElementById("emptyState");
  const rowCount = document.getElementById("rowCount");
  const searchInput = document.getElementById("searchInput");
  const pageMessage = document.getElementById("pageMessage");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalTitle = document.getElementById("modalTitle");
  const modalMessage = document.getElementById("modalMessage");
  const itemForm = document.getElementById("itemForm");
  const itemIdInput = document.getElementById("itemId");
  const saveButton = document.getElementById("saveButton");

  function showPageMessage(text, type = "error") {
    pageMessage.textContent = text;
    pageMessage.className = `message ${type}`;
    if (text) setTimeout(() => { pageMessage.className = "message"; }, 4000);
  }
  function showModalMessage(text, type = "error") {
    modalMessage.textContent = text;
    modalMessage.className = `message ${type}`;
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function formatDate(ts) {
    if (!ts || !ts.toDate) return "-";
    return ts.toDate().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }

  async function loadData() {
    tableBody.innerHTML = `<tr><td colspan="4" class="empty-state">Memuat data...</td></tr>`;
    const snap = await withTimeout(getDocs(query(collection(db, "pengumuman"), orderBy("createdAt", "desc"))), 15000, "Memuat data pengumuman");
    allRows = [];
    snap.forEach((d) => allRows.push({ id: d.id, ...d.data() }));
    renderTable();
  }

  function renderTable() {
    const search = searchInput.value.trim().toLowerCase();
    const rows = allRows.filter((r) => !search || (r.judul || "").toLowerCase().includes(search));
    rowCount.textContent = `${rows.length} pengumuman`;
    emptyState.style.display = rows.length === 0 ? "block" : "none";
    tableBody.innerHTML = "";
    rows.forEach((r) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(r.judul || "-")}</td>
        <td><span class="badge ${r.published ? "active" : "inactive"}">${r.published ? "Published" : "Draft"}</span></td>
        <td>${formatDate(r.createdAt)}</td>
        <td>
          <div class="row-actions">
            <button class="button-ghost" data-action="edit" data-id="${r.id}">Edit</button>
            <button class="button-danger" data-action="delete" data-id="${r.id}">Hapus</button>
          </div>
        </td>`;
      tableBody.appendChild(tr);
    });
  }

  searchInput.addEventListener("input", renderTable);

  tableBody.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const row = allRows.find((r) => r.id === btn.dataset.id);
    if (!row) return;

    if (btn.dataset.action === "edit") openModal(row);

    if (btn.dataset.action === "delete") {
      if (!confirm(`Hapus pengumuman "${row.judul}"?`)) return;
      try {
        await withTimeout(deleteDoc(doc(db, "pengumuman", row.id)), 15000, "Hapus data");
        showPageMessage(`Pengumuman berhasil dihapus.`, "success");
        loadData();
      } catch (err) {
        console.error(err);
        showPageMessage("Gagal menghapus data.");
      }
    }
  });

  function openModal(row = null) {
    itemForm.reset();
    showModalMessage("");
    if (row) {
      modalTitle.textContent = "Edit Pengumuman";
      itemIdInput.value = row.id;
      document.getElementById("judul").value = row.judul || "";
      document.getElementById("isi").value = row.isi || "";
      document.getElementById("published").checked = row.published !== false;
    } else {
      modalTitle.textContent = "Buat Pengumuman";
      itemIdInput.value = "";
    }
    modalBackdrop.classList.add("open");
  }
  function closeModal() { modalBackdrop.classList.remove("open"); }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  document.getElementById("addButton").addEventListener("click", () => openModal());
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("cancelButton").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

  itemForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    showModalMessage("");
    const editingId = itemIdInput.value;
    const judul = document.getElementById("judul").value.trim();
    const isi = document.getElementById("isi").value.trim();
    const published = document.getElementById("published").checked;

    saveButton.disabled = true;
    saveButton.innerHTML = `<span class="loading" style="border-top-color:var(--ink); border-color:rgba(0,0,0,.2);"></span> Menyimpan...`;

    try {
      if (editingId) {
        await withTimeout(updateDoc(doc(db, "pengumuman", editingId), { judul, isi, published, updatedAt: serverTimestamp() }), 15000, "Simpan pengumuman");
        showPageMessage(`Pengumuman berhasil diperbarui.`, "success");
      } else {
        await withTimeout(addDoc(collection(db, "pengumuman"), { judul, isi, published, createdAt: serverTimestamp(), updatedAt: serverTimestamp() }), 15000, "Simpan pengumuman");
        showPageMessage(`Pengumuman berhasil dibuat.`, "success");
      }
      closeModal();
      loadData();
    } catch (err) {
      console.error(err);
      showModalMessage("Gagal menyimpan data. Coba lagi.");
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "Simpan";
    }
  });

  loadData().catch((err) => { console.error(err); showPageMessage("Gagal memuat data pengumuman."); });
</script>

</body>
</html>
