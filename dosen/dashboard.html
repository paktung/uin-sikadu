<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Dosen - SIKADU</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1788321368/logo-uin-gusdur_brzgmv.jpg" alt="Logo UIN Gus Dur"></div>
      <div>
        <div class="name">SIKADU</div>
        <div class="role">Panel Dosen</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="active">Dashboard</a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser">Memuat...</div>
      <button id="logoutButton" class="button-secondary sidebar-logout">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 id="greeting">Dashboard</h1>
        <p>Halaman dosen sedang dalam pengembangan.</p>
      </div>
    </div>

    <div class="card">
      <p>Selamat datang! Fitur untuk mengelola kelas, materi, tugas, dan nilai akan dibangun di folder <code>/dosen</code> pada tahap berikutnya, setelah panel admin selesai.</p>
    </div>
  </main>
</div>

<script type="module">
  import { guardPage, logout } from "../assets/auth-guard.js";

  const { profile } = await guardPage("dosen");
  document.getElementById("sidebarUser").textContent = profile.nama || profile.username || "Dosen";
  document.getElementById("greeting").textContent = `Halo, ${profile.nama || profile.username}`;
  document.getElementById("logoutButton").addEventListener("click", logout);
</script>

</body>
</html>
