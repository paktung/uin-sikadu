<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Awal - SIKADU</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    width: 100%; max-width: 440px;
    background: rgba(255,255,255,.97);
    border-radius: var(--radius-lg);
    padding: 40px 35px;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
  }
  .login-card .logo { width: 78px; height: 78px; font-size: 25px; border-radius: 22px; margin: 0 auto 20px; }
  .login-card h1 { text-align: center; font-size: 25px; margin-bottom: 8px; }
  .login-card .subtitle { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .login-card .button-primary { width: 100%; font-size: 16px; margin-top: 4px; }
</style>
</head>
<body class="brand-bg">

<div class="login-wrap">
  <div class="login-card">

    <div class="logo">SK</div>
    <h1>Setup Admin Pertama</h1>
    <div class="subtitle">
      Halaman ini hanya bisa dipakai <strong>satu kali</strong>, selama belum
      ada satu pun akun di sistem. Setelah admin pertama dibuat, gunakan
      halaman <a href="login.html">login</a> seperti biasa, dan buat
      akun dosen/mahasiswa lewat panel admin.
    </div>

    <div id="message" class="message"></div>

    <form id="setupForm">
      <div class="form-group">
        <label for="username">Username Admin</label>
        <input type="text" id="username" placeholder="mis. admin" required>
      </div>
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Nama admin" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required minlength="6">
          <button type="button" id="togglePassword" class="toggle-password">Tampilkan</button>
        </div>
      </div>
      <button type="submit" id="setupButton" class="button-primary">Buat Akun Admin</button>
    </form>

  </div>
</div>

<script type="module">
  import { auth, db } from "./assets/firebase-config.js";
  import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import { doc, setDoc, serverTimestamp, collection, getCountFromServer } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("setupForm");
  const usernameInput = document.getElementById("username");
  const namaInput = document.getElementById("nama");
  const passwordInput = document.getElementById("password");
  const setupButton = document.getElementById("setupButton");
  const message = document.getElementById("message");
  const togglePassword = document.getElementById("togglePassword");

  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "Sembunyikan" : "Tampilkan";
  });

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = `message ${type}`;
  }

  // Cek lebih dulu apakah sudah ada user sama sekali. Kalau sudah, halaman
  // ini ditutup supaya tidak bisa dipakai untuk membuat admin liar.
  // (Ini pemeriksaan sisi client untuk UX; penguncian yang sebenarnya harus
  // ditegakkan lewat Firestore Security Rules - lihat firestore.rules.)
  (async () => {
    try {
      const countSnap = await getCountFromServer(collection(db, "users"));
      if (countSnap.data().count > 0) {
        form.style.display = "none";
        showMessage("Setup sudah pernah dilakukan. Silakan gunakan halaman login.", "warn");
      }
    } catch (err) {
      console.error(err);
    }
  })();

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const username = usernameInput.value.trim();
    const nama = namaInput.value.trim();
    const password = passwordInput.value;
    const email = `${username}@sikadu.local`;

    setupButton.disabled = true;
    setupButton.innerHTML = `<span class="loading"></span> Membuat akun...`;

    try {
      const countSnap = await getCountFromServer(collection(db, "users"));
      if (countSnap.data().count > 0) {
        showMessage("Setup sudah pernah dilakukan. Silakan gunakan halaman login.", "warn");
        setupButton.disabled = false;
        setupButton.textContent = "Buat Akun Admin";
        return;
      }

      const credential = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db, "users", credential.user.uid), {
        username,
        nama,
        level: "admin",
        isActive: true,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
      });

      showMessage("Akun admin berhasil dibuat. Mengarahkan ke dashboard...", "success");
      setTimeout(() => { window.location.href = "admin/dashboard.html"; }, 800);

    } catch (error) {
      console.error(error);
      const messages = {
        "auth/email-already-in-use": "Username tersebut sudah dipakai.",
        "auth/weak-password": "Password terlalu lemah (minimal 6 karakter).",
      };
      showMessage(messages[error.code] || "Gagal membuat akun admin. Coba lagi.");
      setupButton.disabled = false;
      setupButton.textContent = "Buat Akun Admin";
    }
  });
</script>

</body>
</html>
